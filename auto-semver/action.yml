name: "auto-semver"
description: >
  Automatically computes the next semver version from conventional commits
  since the last tag and emits version, tag, and bump outputs.

author: "ori-edge"

inputs:
  tag-parent-depth:
    description: >
      Number of first-parent hops to walk back from the tag's commit SHA to
      find the ancestor commit that lives on the main branch. With fishbone
      tagging the tag sits on a merge commit whose first parent is the
      main-branch commit, so the default of 1 is correct for that topology.
    required: false
    default: "1"
  tag-prefix:
    description: >
      Prefix of the tags to read and to create, e.g. "tools/". The action then
      reads only the tags <prefix>vX.Y.Z and creates <prefix>vX.Y.Z. Use it to
      version a subdirectory on its own, such as a Go module in tools/, whose
      tags Go expects as tools/vX.Y.Z. The prefix must end in "/". Empty reads
      vX.Y.Z and X.Y.Z.
    required: false
    default: ""
  paths:
    description: >
      Paths that a commit must touch to count, one for each line or comma,
      relative to the repository root. A directory matches each file under it.
      A leading "!" excludes a path, e.g. "!tools/". When no commit since the
      last tag touches a path in scope, there is nothing to release. Empty
      counts every commit.
    required: false
    default: ""
  initial-version:
    description: >
      Version of the first tag, e.g. "0.1.0", when no tag with the prefix
      exists. Empty seeds the patch from the count of all commits.
    required: false
    default: ""

outputs:
  version:
    description: >
      The computed next version string (e.g. "1.2.3"), or empty string when
      there is nothing to release (tag already exists, no suitable base tag
      found on the current branch, or no prior tags exist yet).
  tag:
    description: >
      The computed next tag (e.g. "v1.2.3", or "tools/v1.2.3" with a
      tag-prefix), or empty string when there is nothing to release.
  bump:
    description: >
      The bump type applied: "major", "minor", or "patch". Empty when there
      is nothing to release.

runs:
  using: "node24"
  main: "dist/index.js"
