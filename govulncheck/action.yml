name: "Go vulnerability check"
description: >
  Checks out the caller's repo, sets up Go via mise, and runs govulncheck through
  govulncheck-filter, which enforces a time-boxed .govulncheck-ignore.yaml
  allowlist. Any called vulnerability without a valid, in-window allowlist entry
  fails the build (configurable). Pass GH_TOKEN as an env var on the step if
  private module access is needed.
inputs:
  goVersionFile:
    description: "path to file containing Go version (e.g., go.mod); ignored when mise.toml is present"
    default: "go.mod"
    required: false
  failOnFixableVulnerabilities:
    description: "'true' to fail the build on policy violations; 'false' downgrades them to a warning"
    default: "true"
    required: false
  failOnUnfixableVulnerabilities:
    description: "'true' to also treat called vulnerabilities with no fix available as violations; 'false' reports them as warnings only"
    default: "false"
    required: false
  govulncheckVersion:
    description: "version of golang.org/x/vuln/cmd/govulncheck to install"
    default: "v1.5.0"
    required: false
  govulncheckFilterVersion:
    description: "version of github.com/ori-edge/govulncheck-filter to install"
    default: "v0.0.3"
    required: false
runs:
  using: composite
  steps:
    - name: Check out
      uses: actions/checkout@v6

    - name: Create mise.toml from goVersionFile
      if: hashFiles('mise.toml') == ''
      shell: bash
      run: |
        ver=$(grep -m1 '^go ' "${{ inputs.goVersionFile }}" | awk '{print $2}' \
              || cat "${{ inputs.goVersionFile }}")
        printf '[tools]\ngo = "%s"\n' "$ver" > mise.toml

    - name: Setup mise
      uses: jdx/mise-action@v4
      env:
        MISE_GO_SET_GOBIN: 'false'

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        cache-dependency-path: |
          go.sum
          mise.toml

    # Needed so govulncheck can build a repo that imports private ori-edge
    # modules. govulncheck-filter itself is public.
    - name: Configure GitHub authentication
      shell: bash
      run: |
        if [ -n "${GH_TOKEN}" ]; then
          git config --global url."https://${GH_TOKEN}@github.com/ori-edge/".insteadOf "https://github.com/ori-edge/"
        fi

    - name: Add GOBIN to PATH
      shell: bash
      run: echo "$(go env GOBIN)" >> $GITHUB_PATH

    - name: Run govulncheck-filter
      shell: bash
      run: |
        # Prefer the versions the caller pins in mise.toml (single source of
        # truth); only install when the tool is not already on PATH.
        if ! command -v govulncheck >/dev/null 2>&1; then
          go install "golang.org/x/vuln/cmd/govulncheck@${{ inputs.govulncheckVersion }}"
        fi
        if ! command -v govulncheck-filter >/dev/null 2>&1; then
          go install "github.com/ori-edge/govulncheck-filter@${{ inputs.govulncheckFilterVersion }}"
        fi

        # govulncheck-filter runs govulncheck itself (adds -format json), enforces
        # .govulncheck-ignore.yaml (found by walking up to the module root; a
        # missing file means no exceptions), emits per-module ::error/::warning
        # annotations against go.mod, and owns the exit code. No pipe, so
        # `set -o pipefail` has nothing to trip on.
        args=(-invoke -github-annotations)
        if [ "${{ inputs.failOnUnfixableVulnerabilities }}" != "true" ]; then
          args+=(-ignore-unfixable)
        fi
        if [ "${{ inputs.failOnFixableVulnerabilities }}" != "true" ]; then
          args+=(-warn-only)
        fi

        govulncheck-filter "${args[@]}" -- ./...
