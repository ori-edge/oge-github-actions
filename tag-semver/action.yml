name: "Semver tag"
description: >
  Computes the next semver from conventional commits since the last tag and tags HEAD
  (both vX.Y.Z and X.Y.Z, or only <prefix>vX.Y.Z with a tag-prefix). No-op if HEAD is
  already tagged. No checkout required. Caller's job must have permissions.contents:
  write. Set GITHUB_TOKEN in the step or job env; falls back to the default token.
inputs:
  tag-prefix:
    description: >
      Prefix of the tags to read and to create, e.g. "tools/". With a prefix the
      action creates only <prefix>vX.Y.Z: a bare X.Y.Z would collide with the tags
      of the rest of the repository. Empty creates vX.Y.Z and X.Y.Z.
    required: false
    default: ""
  paths:
    description: >
      Paths that a commit must touch to count, one for each line or comma. A
      leading "!" excludes a path, e.g. "!tools/". When no commit since the last
      tag touches a path in scope, the action tags nothing. Empty counts every
      commit.
    required: false
    default: ""
  initial-version:
    description: >
      Version of the first tag, e.g. "0.1.0", when no tag with the prefix exists.
      Empty seeds the patch from the count of all commits.
    required: false
    default: ""
outputs:
  version:
    description: "Tagged version (e.g. '1.2.3'), empty string if nothing to release"
    value: ${{ steps.semver.outputs.version }}
  tag:
    description: "Created tag (e.g. 'v1.2.3' or 'tools/v1.2.3'), empty string if nothing was tagged"
    value: ${{ steps.semver.outputs.tag }}
runs:
  using: composite
  steps:
    # HACK: symlink this repo's root into _actions/current so sibling actions are
    # reachable as ./../../_actions/current/<name> local paths.
    # TODO: once https://github.com/orgs/community/discussions/26245#discussioncomment-15601440
    # ships the $/ syntax, remove this step and replace the local-path uses: below with $/auto-semver etc.
    - name: Link sibling actions
      shell: bash
      run: ln -sf "$GITHUB_ACTION_PATH/.." /home/runner/work/_actions/current

    - id: semver
      uses: ./../../_actions/current/auto-semver
      with:
        tag-parent-depth: '0'
        tag-prefix: ${{ inputs.tag-prefix }}
        paths: ${{ inputs.paths }}
        initial-version: ${{ inputs.initial-version }}

    # With a prefix, only the prefixed tag: a bare X.Y.Z belongs to the rest of
    # the repository.
    - if: steps.semver.outputs.tag != ''
      uses: ./../../_actions/current/tag
      with:
        tags: >-
          ${{ inputs.tag-prefix == ''
            && format('{0},{1}', steps.semver.outputs.tag, steps.semver.outputs.version)
            || steps.semver.outputs.tag }}
