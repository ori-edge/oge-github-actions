name: CI

on:
  push:
    branches: [main]
    paths:
      - "auto-semver/**"
      - "compute-version/**"
      - "tag/**"
      - "tag-helm-release/**"
      - "shared/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "auto-semver/**"
      - "compute-version/**"
      - "tag/**"
      - "tag-helm-release/**"
      - "shared/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"

jobs:
  lint-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shared-test:
    name: Test (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: node --test test/index.test.js
        working-directory: shared

  test:
    name: Test (${{ matrix.action }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: [auto-semver, compute-version, tag, tag-helm-release]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ${{ matrix.action }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.action }}

      - run: npm test
        working-directory: ${{ matrix.action }}

  build:
    name: Build all dist
    runs-on: ubuntu-latest
    # Build dist on the pull request and commit it to the pull request branch.
    # The rules on main reject a push from CI, so dist must arrive with the
    # pull request. A pull request from a fork or from dependabot gets a
    # read-only token, so the job skips it.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [shared-test, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build all actions
        run: |
          for action in auto-semver compute-version tag tag-helm-release; do
            echo "==> Building $action"
            (cd "$action" && npm ci && npm run build)
          done

      - name: Commit dist to the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add auto-semver/dist/ compute-version/dist/ tag/dist/ tag-helm-release/dist/
          if git diff --staged --quiet; then
            echo "dist is up to date"
            exit 0
          fi
          node .github/scripts/commit-dist.mjs

  self-test:
    name: Self Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shared-test, test]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Test auto-semver
        id: semver
        uses: ./auto-semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test compute-version
        uses: ./compute-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
